<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficina Mecânica - Veículos</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <header>
    <h1>Sistema da Oficina Mecânica</h1>
    <p>Cadastro e listagem de veículos (Parte 1)</p>
  </header>

  <main>
    <section class="card">
      <h2>Cadastrar Novo Veículo</h2>
      <div id="mensagem-erro" class="erro" hidden></div>

      <form id="form-veiculo">
        <div class="campo">
          <label for="placa">Placa (7 caracteres):</label>
          <input type="text" id="placa" placeholder="Ex: ABC1D23">
        </div>

        <div class="campo">
          <label for="modelo">Modelo:</label>
          <input type="text" id="modelo" placeholder="Ex: Fiat Palio">
        </div>

        <div class="campo">
          <label for="ano">Ano:</label>
          <input type="number" id="ano" placeholder="Ex: 2019">
        </div>

        <div class="campo">
          <label for="km">Quilometragem (km):</label>
          <input type="number" id="km" placeholder="Ex: 55000">
        </div>

        <div class="campo">
          <label for="cor">Cor:</label>
          <select id="cor">
            <option value="Branco">Branco</option>
            <option value="Preto">Preto</option>
            <option value="Prata">Prata</option>
            <option value="Cinza">Cinza</option>
            <option value="Vermelho">Vermelho</option>
            <option value="Azul">Azul</option>
          </select>
        </div>

        <div class="campo">
          <label for="nomeCliente">Nome do Cliente:</label>
          <input type="text" id="nomeCliente" placeholder="Ex: Maria Oliveira">
        </div>

        <div class="campo-check">
          <input type="checkbox" id="revisaoEmDia" checked>
          <label for="revisaoEmDia">Revisão em dia</label>
        </div>

        <button type="submit">Cadastrar Veículo</button>
      </form>
    </section>

    <section class="card">
      <h2>Veículos Cadastrados</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Placa</th>
            <th>Modelo</th>
            <th>Ano</th>
            <th>KM</th>
            <th>Cor</th>
            <th>Revisão</th>
            <th>Cliente</th>
          </tr>
        </thead>
        <tbody id="lista-veiculos"></tbody>
      </table>
    </section>
  </main>

  <script src="scripts/app.js"></script>
</body>
</html>
